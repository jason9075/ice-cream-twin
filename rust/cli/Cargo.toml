[package]
name = "icecream-cli"
version = "0.1.0"
edition.workspace = true
description = "Ice-cream digital twin server: the simulation over a WebSocket for browser viewers, JSON lines over stdin/stdout, benchmark"

[lib]
name = "icecream_cli"
path = "src/lib.rs"

[[bin]]
name = "icecream"
path = "src/main.rs"

[dependencies]
icecream-core = { path = "../core" }
icecream-gpu = { path = "../gpu" }
serde_json = "1"
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.6.2", features = ["fs"] }
futures-util = "0.3.31"

[dev-dependencies]
tokio-tungstenite = "0.24"
