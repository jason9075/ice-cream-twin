[package]
name = "icecream-cli"
version = "0.1.0"
edition.workspace = true
description = "Ice-cream digital twin: the app (window), the control server (WebSocket), JSON lines over stdin/stdout, screenshots, benchmark"

[lib]
name = "icecream_cli"
path = "src/lib.rs"

[[bin]]
name = "icecream"
path = "src/main.rs"

[dependencies]
icecream-core = { path = "../core" }
icecream-gpu = { path = "../gpu" }
icecream-view = { path = "../view" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
winit = "0.30"
egui = "0.29"
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-wgpu = { version = "0.29", default-features = false, features = ["winit", "wayland", "x11"] }
glam = "0.29"
pollster = "0.3"
png = "0.17"
futures-util = "0.3.31"

[dev-dependencies]
tokio-tungstenite = "0.24"
