name: Rust

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # no GPU on the runners: the GPU and rendering tests say so and pass, the server falls back to the CPU
      - name: Test (collision, mass conservation, arm, fixture regression, control server)
        working-directory: rust
        run: cargo test --release

      - name: Benchmark
        working-directory: rust
        run: cargo run --release -q -p icecream-cli -- bench
