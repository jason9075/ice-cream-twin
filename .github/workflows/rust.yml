name: Rust core and server

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # no GPU on the runners: the GPU-vs-CPU tests say so and pass, the server falls back to the CPU
      - name: Test (collision, mass conservation, arm, fixture regression, WebSocket server)
        working-directory: rust
        run: cargo test --release

      - name: Benchmark
        working-directory: rust
        run: cargo run --release -q -p icecream-cli -- bench

  viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build the viewer
        run: |
          npm ci
          npm run build
